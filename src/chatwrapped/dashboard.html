<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatWrapped</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #fff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #ea580c; --c0: #f59e0b; --c1: #8b5cf6; --c2: #3b82f6; --c3: #e11d48;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --panel: #1c1917; --ink: #f5f5f4; --muted: #a8a29e; --line: #292524; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .subtitle { color: var(--muted); margin-bottom: 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .bar label { color: var(--muted); margin-right: 4px; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  input[type=number] { width: 64px; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  nav { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; }
  nav button { border: 0; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; }
  nav button.on { color: var(--ink); background: none; border-bottom-color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child, #view table:not(.grid) tr > :nth-child(2) { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; }
  th.on { color: var(--ink); }
  td.cellbar { position: relative; }
  td.cellbar i { position: absolute; right: 0; top: 20%; bottom: 20%; background: var(--accent); opacity: .18; border-radius: 3px; }
  .dim { color: var(--muted); opacity: .6; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .grid td { text-align: center; min-width: 34px; font-size: 12px; }
  .race { position: relative; }
  .race .row { position: absolute; left: 0; right: 0; height: 28px; display: flex; align-items: center; gap: 8px; transition: transform .45s ease; }
  .race .name { width: 120px; flex: none; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .race .fill { height: 22px; background: var(--accent); border-radius: 4px; transition: width .45s ease; min-width: 2px; }
  .race .val { font-variant-numeric: tabular-nums; color: var(--muted); }
  .racedate { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; min-width: 160px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="subtitle" id="subtitle"></div>
  <div class="bar" id="reaction"></div>
  <div class="bar" id="time-window"></div>
  <div class="bar"><label>Min msgs for rates</label><input type="number" id="min-msgs" value="50" min="0" step="10"></div>
  <nav id="tabs"></nav>
  <section id="view"></section>
</main>
<script>window.DATA = /*DATA*/null;</script>
<script>
// The CLI fills in DATA (see build_data in cli.py). People and messages are referred to by index.
const data = window.DATA;
const people = data.people;
const EMOJI = ['😂', '💀', '😭', '❤️'];
const DAY = 86400;

const REACTION_FILTERS = {
  funny: { label: '😂💀😭 Funny', categories: [0, 1, 2] },
  laugh: { label: '😂 Laughs', categories: [0] },
  skull: { label: '💀 Skulls', categories: [1] },
  sob: { label: '😭 Sobs', categories: [2] },
  heart: { label: '❤️ Hearts', categories: [3] },
};
const TIME_WINDOWS = { all: 'All time', 365: 'Last 365 days', 30: 'Last 30 days' };

// Everything the viewer can change. Buttons update it and the page re-renders.
const state = {
  reaction: 'funny',
  timeWindow: 'all',
  minMsgs: 50,
  tab: 'rankings',
  sortBy: 'receivedPer100',
  whomMode: 'count',
  hoursMode: 'rate',
};

// Each page adds itself here as { title, render }.
const PAGES = {};

// ---------- helpers ----------

function $(id) {
  return document.getElementById(id);
}

function escapeHtml(text) {
  const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
  return String(text).replace(/[&<>"]/g, char => entities[char]);
}

function formatNumber(value, decimals = 0) {
  if (value == null) return '<span class="dim">—</span>';
  return value.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function formatDate(unixTime) {
  return new Date(unixTime * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function zeros(length = people.length) {
  return new Array(length).fill(0);
}

function sum(numbers) {
  return numbers.reduce((total, n) => total + n, 0);
}

function sender(msg) {
  return data.msgs[msg][0];
}

function sentAt(msg) {
  return data.msgs[msg][1];
}

function card(html) {
  return `<div class="card">${html}</div>`;
}

function note(html) {
  return `<p class="note">${html}</p>`;
}

// Background shading for heatmap cells; `fraction` is 0 to 1.
function heat(fraction, strength) {
  return `background: color-mix(in srgb, var(--accent) ${Math.round(strength * fraction)}%, transparent)`;
}

// Adds up a grid of rows column by column.
function columnTotals(rows) {
  return rows[0].map((_, column) => sum(rows.map(row => row[column])));
}

function windowStart() {
  if (state.timeWindow === 'all') return 0;
  return Date.now() / 1000 - Number(state.timeWindow) * DAY;
}

// Reactions to messages sent inside the chosen time window.
function filteredReacts(categories = REACTION_FILTERS[state.reaction].categories) {
  const start = windowStart();
  return data.reacts.filter(([, msg, category]) => categories.includes(category) && sentAt(msg) >= start);
}

function countStats() {
  const start = windowStart();
  const msgCount = zeros();
  const charCount = zeros();
  const received = zeros();
  const given = zeros();
  const matrix = people.map(() => zeros());  // matrix[giver][receiver]

  for (const [person, time, length] of data.msgs) {
    if (time >= start) {
      msgCount[person]++;
      charCount[person] += length;
    }
  }

  const reacts = filteredReacts();
  for (const [reactor, msg] of reacts) {
    received[sender(msg)]++;
    given[reactor]++;
    matrix[reactor][sender(msg)]++;
  }

  const toughCrowd = toughCrowdScores(reacts, given);
  return { msgCount, charCount, received, given, matrix, toughCrowd };
}

// Tough-crowd score: a react from someone who hardly ever reacts is worth more.
// Each react counts as (average reacts given per person) / (reacts this person gave).
function toughCrowdScores(reacts, given) {
  const reactors = given.filter(count => count > 0);
  const average = sum(reactors) / (reactors.length || 1);
  const scores = zeros();
  for (const [reactor, msg] of reacts) {
    scores[sender(msg)] += average / given[reactor];
  }
  return scores;
}

// ---------- rankings ----------

const RANKING_COLUMNS = [
  { key: 'msgs', label: 'Msgs' },
  { key: 'received', label: 'Received' },
  { key: 'receivedPer100', label: 'Recv / 100 msgs', decimals: 2 },
  { key: 'receivedPer1k', label: 'Recv / 1k chars', decimals: 2 },
  { key: 'given', label: 'Given' },
  { key: 'givenPer100', label: 'Given / 100 msgs', decimals: 2 },
  { key: 'toughCrowd', label: 'Tough-crowd score', decimals: 1 },
  { key: 'toughCrowdPer100', label: 'Tough-crowd / 100 msgs', decimals: 2 },
];

function renderRankings() {
  const stats = countStats();
  const rows = [];

  people.forEach((name, p) => {
    const msgs = stats.msgCount[p];
    if (!msgs && !stats.given[p]) return;  // not around in this time window

    // Rates stay empty for people with too few messages for them to mean anything.
    const rate = (count, total, per) => (msgs >= state.minMsgs && total ? per * count / total : null);

    rows.push({
      name,
      msgs,
      received: stats.received[p],
      receivedPer100: rate(stats.received[p], msgs, 100),
      receivedPer1k: rate(stats.received[p], stats.charCount[p], 1000),
      given: stats.given[p],
      givenPer100: rate(stats.given[p], msgs, 100),
      toughCrowd: stats.toughCrowd[p],
      toughCrowdPer100: rate(stats.toughCrowd[p], msgs, 100),
    });
  });

  const key = state.sortBy;
  rows.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1));
  const best = Math.max(...rows.map(row => row[key] ?? 0)) || 1;

  let html = '<table><tr><th>#</th><th>Person</th>';
  for (const column of RANKING_COLUMNS) {
    html += `<th data-sort="${column.key}" class="${column.key === key ? 'on' : ''}">${column.label}</th>`;
  }
  html += '</tr>';

  rows.forEach((row, rank) => {
    html += `<tr><td>${row[key] == null ? '' : rank + 1}</td><td>${escapeHtml(row.name)}</td>`;
    for (const column of RANKING_COLUMNS) {
      const value = row[column.key];
      const bar = column.key === key && value ? `<i style="width: ${100 * value / best}%"></i>` : '';
      html += `<td class="cellbar">${bar}${formatNumber(value, column.decimals)}</td>`;
    }
    html += '</tr>';
  });
  html += '</table>';

  let explanation = `Click a column to rank by it. Rates skip anyone with fewer than ${state.minMsgs} messages in this window.
    Reactions count toward the day the message was sent, and reacting to your own message doesn't count.`;
  explanation += ` <b>Tough-crowd score</b> weighs every reaction by how stingy the person giving it is, so a 💀 from
    the friend who never reacts beats one from the group's reaction machine.`;
  return card(html) + note(explanation);
}

PAGES.rankings = { title: 'Rankings', render: renderRankings };

// ---------- who -> whom ----------

function renderWhoToWhom() {
  const { matrix, msgCount, given } = countStats();
  const active = people.map((_, p) => p).filter(p => msgCount[p] || given[p]);
  const asPercent = state.whomMode === 'percent';

  const value = (giver, receiver) => {
    if (!asPercent) return matrix[giver][receiver];
    return given[giver] ? 100 * matrix[giver][receiver] / given[giver] : 0;
  };
  const biggest = Math.max(...active.flatMap(giver => active.map(receiver => value(giver, receiver)))) || 1;

  let html = '<table class="grid"><tr><th>giver ↓ / receiver →</th>';
  for (const receiver of active) {
    html += `<th>${escapeHtml(people[receiver])}</th>`;
  }
  html += '</tr>';

  for (const giver of active) {
    html += `<tr><td>${escapeHtml(people[giver])}</td>`;
    for (const receiver of active) {
      const v = value(giver, receiver);
      const label = giver === receiver || !v ? '' : formatNumber(v) + (asPercent ? '%' : '');
      html += `<td style="${heat(v / biggest, 80)}">${label}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';

  const fans = [];
  for (const receiver of active) {
    let fan = active[0];
    for (const giver of active) {
      if (matrix[giver][receiver] > matrix[fan][receiver]) fan = giver;
    }
    if (matrix[fan][receiver]) {
      fans.push(`<b>${escapeHtml(people[receiver])}</b>'s biggest fan: ${escapeHtml(people[fan])} (${matrix[fan][receiver]})`);
    }
  }

  const modes = toggle('whomMode', { count: 'Raw count', percent: "% of giver's reacts" });
  return `<div class="bar">${modes}</div>` + card(html) + note(fans.join(' · '));
}

PAGES.whom = { title: 'Who → Whom', render: renderWhoToWhom };

// ---------- bar race ----------

const RACE_ROW_HEIGHT = 32;
const race = { frames: [], frame: 0, timer: null };

function renderBarRace() {
  const daysPerFrame = { all: 30, 365: 7, 30: 1 }[state.timeWindow];

  // One entry per reaction, pointing at the message it was on, oldest first.
  const reactedMsgs = filteredReacts().map(([, msg]) => msg).sort((a, b) => sentAt(a) - sentAt(b));

  // Each frame is everyone's running total at the end of that month / week / day.
  race.frames = [];
  const totals = zeros();
  let next = 0;
  let frameEnd = reactedMsgs.length ? sentAt(reactedMsgs[0]) : 0;
  while (next < reactedMsgs.length) {
    frameEnd += daysPerFrame * DAY;
    while (next < reactedMsgs.length && sentAt(reactedMsgs[next]) < frameEnd) {
      totals[sender(reactedMsgs[next])]++;
      next++;
    }
    race.frames.push({ time: frameEnd, totals: totals.slice() });
  }
  race.frame = race.frames.length - 1;
  setTimeout(drawRace);  // draw once the rows below are on the page

  let rows = '';
  people.forEach((name, p) => {
    rows += `<div class="row" id="race-${p}"><span class="name">${escapeHtml(name)}</span><span class="fill"></span><span class="val"></span></div>`;
  });

  const controls = `<div class="bar">
    <button id="play">▶ Play</button>
    <input type="range" id="scrub" min="0" max="${Math.max(0, race.frames.length - 1)}" value="${race.frame}">
    <span class="racedate" id="racedate"></span>
  </div>`;
  const unit = { 30: 'month', 7: 'week', 1: 'day' }[daysPerFrame];
  return controls
    + card(`<div class="race" style="height: ${people.length * RACE_ROW_HEIGHT}px">${rows}</div>`)
    + note(`Running total of ${REACTION_FILTERS[state.reaction].label} received, one frame per ${unit}.`);
}

function drawRace() {
  const frame = race.frames[race.frame];
  if (!frame || !$('racedate')) return;  // no reactions, or we've already left this tab

  const best = Math.max(...frame.totals) || 1;
  const order = people.map((_, p) => p).sort((a, b) => frame.totals[b] - frame.totals[a]);
  order.forEach((p, place) => {
    const row = $(`race-${p}`);
    row.style.transform = `translateY(${place * RACE_ROW_HEIGHT}px)`;
    row.querySelector('.fill').style.width = `calc((100% - 200px) * ${frame.totals[p] / best})`;
    row.querySelector('.val').textContent = frame.totals[p];
  });
  $('racedate').textContent = formatDate(frame.time);
  $('scrub').value = race.frame;
}

function stopRace() {
  clearInterval(race.timer);
  race.timer = null;
  if ($('play')) $('play').textContent = '▶ Play';
}

function playOrPauseRace() {
  if (race.timer) return stopRace();
  if (race.frame >= race.frames.length - 1) race.frame = 0;  // start over from the beginning
  $('play').textContent = '❚❚ Pause';
  race.timer = setInterval(() => {
    if (race.frame >= race.frames.length - 1) return stopRace();
    race.frame++;
    drawRace();
  }, 500);
}

PAGES.race = { title: 'Bar race', render: renderBarRace };

// ---------- hours ----------

function renderHours() {
  const start = windowStart();
  const hourOf = time => new Date(time * 1000).getHours();
  const sent = people.map(() => zeros(24));
  const got = people.map(() => zeros(24));

  for (const [person, time] of data.msgs) {
    if (time >= start) sent[person][hourOf(time)]++;
  }
  for (const [, msg] of filteredReacts()) {
    got[sender(msg)][hourOf(sentAt(msg))]++;
  }

  const rows = [{ name: 'Everyone', sent: columnTotals(sent), got: columnTotals(got) }];
  people.forEach((name, p) => rows.push({ name, sent: sent[p], got: got[p] }));
  const shown = rows.filter(row => sum(row.sent) >= state.minMsgs);

  // A rate needs at least 10 messages in that hour, otherwise the cell stays blank.
  const value = (row, hour) => {
    if (state.hoursMode === 'count') return row.got[hour];
    return row.sent[hour] >= 10 ? 100 * row.got[hour] / row.sent[hour] : null;
  };
  const biggest = Math.max(...shown.flatMap(row => row.got.map((_, hour) => value(row, hour) ?? 0))) || 1;
  const hourLabel = hour => (hour % 12 || 12) + (hour < 12 ? 'a' : 'p');

  let html = '<table class="grid"><tr><th></th>';
  for (let hour = 0; hour < 24; hour++) {
    html += `<th>${hourLabel(hour)}</th>`;
  }
  html += '</tr>';

  for (const row of shown) {
    html += `<tr><td>${escapeHtml(row.name)}</td>`;
    for (let hour = 0; hour < 24; hour++) {
      const v = value(row, hour);
      html += `<td style="${heat((v ?? 0) / biggest, 85)}">${v == null ? '' : formatNumber(v)}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';

  const modes = toggle('hoursMode', { rate: 'Reacts per 100 msgs', count: 'Raw count' });
  return `<div class="bar">${modes}</div>` + card(html)
    + note('By the hour the message was sent, in your local time. Rates need at least 10 messages in that hour.');
}

PAGES.hours = { title: 'When (hours)', render: renderHours };

// ---------- page shell ----------

function toggle(stateKey, options) {
  let html = '';
  for (const [value, label] of Object.entries(options)) {
    html += `<button data-set="${stateKey}" data-value="${value}" class="${state[stateKey] === value ? 'on' : ''}">${label}</button>`;
  }
  return html;
}

function render() {
  stopRace();

  const reactionLabels = {};
  for (const [key, filter] of Object.entries(REACTION_FILTERS)) reactionLabels[key] = filter.label;
  const tabTitles = {};
  for (const [key, page] of Object.entries(PAGES)) tabTitles[key] = page.title;

  $('reaction').innerHTML = '<label>Reaction</label>' + toggle('reaction', reactionLabels);
  $('time-window').innerHTML = '<label>Window</label>' + toggle('timeWindow', TIME_WINDOWS);
  $('tabs').innerHTML = toggle('tab', tabTitles);
  $('view').innerHTML = PAGES[state.tab].render();
}

document.addEventListener('click', event => {
  const button = event.target.closest('[data-set]');
  const header = event.target.closest('th[data-sort]');
  if (button) {
    state[button.dataset.set] = button.dataset.value;
    render();
  } else if (header) {
    state.sortBy = header.dataset.sort;
    render();
  } else if (event.target.id === 'play') {
    playOrPauseRace();
  }
});

document.addEventListener('input', event => {
  if (event.target.id === 'min-msgs') {
    state.minMsgs = Number(event.target.value) || 0;
    render();
  }
  if (event.target.id === 'scrub') {
    race.frame = Number(event.target.value);
    drawRace();
  }
});

const firstMsg = data.msgs[0][1];
const lastMsg = data.msgs[data.msgs.length - 1][1];
$('title').textContent = data.chat;
document.title = `${data.chat} · ChatWrapped`;
$('subtitle').textContent = `${data.msgs.length.toLocaleString()} messages · ${data.reacts.length.toLocaleString()} reactions · ${formatDate(firstMsg)} – ${formatDate(lastMsg)}`;
render();
</script>
</body>
</html>
